name: Build APK (unsigned)
# Hasil: artifact "apk-unsigned"; tandatangani + terbitkan di server dengan ~/terbitkan-adzanmi.sh

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'iosApp/**']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit test + build release (unsigned)
        run: ./gradlew :core-prayer:jvmTest :core-astronomy:jvmTest :app:assembleRelease
      - name: Collect outputs
        run: |
          mkdir out
          cp app/build/outputs/apk/release/*.apk out/
          grep -E 'versionCode|versionName' app/build.gradle.kts | head -2 > out/version.txt
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: apk-unsigned
          path: out/
          retention-days: 30
